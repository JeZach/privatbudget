<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d2d38" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; font-src 'self' data:; upgrade-insecure-requests"
    />
    <title>PrivEk Enkel Budget</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --ink: #0d2d38;
        --muted: #60747b;
        --line: #cfdbde;
        --paper: #eef7f7;
        --panel: #ffffff;
        --deep: #0d2d38;
        --aqua: #00a1b0;
        --good: #0f8b62;
        --bad: #b83b5e;
        --soft: #d9ebed;
        --shadow: 0 14px 34px rgba(13, 45, 56, 0.08);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
      }

      header {
        background: var(--deep);
        color: #eef7f7;
        padding: 22px clamp(16px, 4vw, 34px);
      }

      .topbar,
      main {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #eef7f7;
        color: var(--deep);
        font-weight: 850;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 21px;
      }

      .subtle {
        color: rgba(238, 247, 247, 0.72);
        font-size: 14px;
      }

      main {
        padding: 26px clamp(16px, 4vw, 34px) 38px;
        display: grid;
        gap: 18px;
      }

      .toolbar,
      .summary,
      .panel,
      .auth {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px;
      }

      .month-control,
      .actions,
      .auth-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .month-label {
        min-width: 140px;
        text-align: center;
        font-weight: 800;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
      }

      .metric {
        padding: 20px;
        background: #fff;
        display: grid;
        gap: 8px;
      }

      .metric span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .metric strong {
        font-size: clamp(26px, 4vw, 40px);
        letter-spacing: 0;
      }

      .metric.good strong {
        color: var(--good);
      }

      .metric.bad strong {
        color: var(--bad);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .panel {
        padding: 18px;
        display: grid;
        align-content: start;
        gap: 14px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-head h2 {
        font-size: 20px;
      }

      .rows {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(110px, 150px) 38px;
        gap: 8px;
        align-items: center;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        background: #fff;
        color: var(--ink);
      }

      input:focus {
        outline: 3px solid rgba(0, 161, 176, 0.18);
        border-color: var(--aqua);
      }

      .money {
        text-align: right;
      }

      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        min-height: 38px;
        padding: 9px 12px;
        font-weight: 700;
      }

      button:hover {
        background: var(--soft);
      }

      .primary {
        background: var(--deep);
        color: #fff;
        border-color: var(--deep);
      }

      .primary:hover {
        background: #174653;
      }

      .icon-button {
        padding: 0;
        width: 38px;
      }

      .danger {
        color: var(--bad);
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .auth {
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .auth-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 10px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .topbar,
        .toolbar,
        .grid,
        .auth-grid {
          grid-template-columns: 1fr;
          display: grid;
        }

        .summary {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .icon-button {
          width: 100%;
        }

        .month-label {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="topbar">
          <div class="brand">
            <div class="mark">PE</div>
            <div>
              <h1>PrivEk Enkel Budget</h1>
              <p class="subtle">Inkomster, fasta kostnader och vad som är kvar.</p>
            </div>
          </div>
          <div class="auth-actions">
            <span class="subtle" id="userStatus">Inte inloggad</span>
            <button id="logoutButton" class="hidden" type="button">Logga ut</button>
          </div>
        </div>
      </header>

      <main>
        <section class="auth" id="authPanel">
          <div>
            <h2>Logga in</h2>
            <p class="status">Använd samma konto som i den skarpa webbversionen.</p>
          </div>
          <form class="auth-grid" id="authForm">
            <input id="emailInput" autocomplete="email" type="email" placeholder="E-post" required />
            <input id="passwordInput" autocomplete="current-password" type="password" placeholder="Lösenord" required />
            <button class="primary" type="submit">Logga in</button>
          </form>
          <p class="status" id="authMessage"></p>
        </section>

        <section class="toolbar">
          <div class="month-control">
            <button id="previousMonth" type="button" aria-label="Föregående månad">‹</button>
            <strong class="month-label" id="monthLabel"></strong>
            <button id="nextMonth" type="button" aria-label="Nästa månad">›</button>
          </div>
          <div class="actions">
            <button id="copyPrevious" type="button">Kopiera föregående månad</button>
            <button id="lockMonth" type="button">Markera klar</button>
          </div>
          <p class="status" id="saveStatus">Läser data...</p>
        </section>

        <section class="summary" aria-label="Sammanfattning">
          <div class="metric">
            <span>Inkomster</span>
            <strong id="incomeTotal">0 kr</strong>
          </div>
          <div class="metric">
            <span>Fasta kostnader</span>
            <strong id="costTotal">0 kr</strong>
          </div>
          <div class="metric" id="leftMetric">
            <span>Kvar</span>
            <strong id="leftTotal">0 kr</strong>
          </div>
        </section>

        <section class="grid">
          <section class="panel">
            <div class="panel-head">
              <h2>Inkomster</h2>
              <button id="addIncome" type="button">+ Lägg till</button>
            </div>
            <div class="rows" id="incomeRows"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Fasta kostnader</h2>
              <button id="addCost" type="button">+ Lägg till</button>
            </div>
            <div class="rows" id="costRows"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const storageKey = "privek.simpleBudget.v1";
      const budgetRowId = "main";
      const supabaseConfig = window.PRIVEK_SUPABASE || window.PRIVATBUDGET_SUPABASE || {};
      const hasSupabaseConfig = Boolean(supabaseConfig.url && supabaseConfig.anonKey);
      const supabaseClient = hasSupabaseConfig && window.supabase ? window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey) : null;
      const monthFormatter = new Intl.DateTimeFormat("sv-SE", { month: "long", year: "numeric" });
      const moneyFormatter = new Intl.NumberFormat("sv-SE", { style: "currency", currency: "SEK", maximumFractionDigits: 0 });

      let currentUser = null;
      let currentMonth = monthKey(new Date());
      let saveTimer = null;
      let state = loadLocalState();

      const nodes = {
        authPanel: document.getElementById("authPanel"),
        authForm: document.getElementById("authForm"),
        authMessage: document.getElementById("authMessage"),
        emailInput: document.getElementById("emailInput"),
        passwordInput: document.getElementById("passwordInput"),
        userStatus: document.getElementById("userStatus"),
        logoutButton: document.getElementById("logoutButton"),
        monthLabel: document.getElementById("monthLabel"),
        saveStatus: document.getElementById("saveStatus"),
        incomeTotal: document.getElementById("incomeTotal"),
        costTotal: document.getElementById("costTotal"),
        leftTotal: document.getElementById("leftTotal"),
        leftMetric: document.getElementById("leftMetric"),
        incomeRows: document.getElementById("incomeRows"),
        costRows: document.getElementById("costRows"),
      };

      function newId() {
        return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      }

      function monthKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function dateFromMonthKey(key) {
        const [year, month] = key.split("-").map(Number);
        return new Date(year, month - 1, 1);
      }

      function shiftMonth(key, delta) {
        const date = dateFromMonthKey(key);
        date.setMonth(date.getMonth() + delta);
        return monthKey(date);
      }

      function blankMonth() {
        return {
          incomes: [
            { id: newId(), name: "Lön", amount: 0 },
            { id: newId(), name: "Övrig inkomst", amount: 0 },
          ],
          fixedCosts: [
            { id: newId(), name: "Hyra", amount: 0 },
            { id: newId(), name: "El", amount: 0 },
            { id: newId(), name: "Försäkringar", amount: 0 },
          ],
          locked: false,
        };
      }

      function defaultState() {
        return {
          version: 4,
          mode: "simple-fixed-budget",
          months: {
            [currentMonth]: blankMonth(),
          },
        };
      }

      function loadLocalState() {
        const saved = localStorage.getItem(storageKey);
        if (!saved) return defaultState();
        try {
          return normalizeState(JSON.parse(saved));
        } catch {
          localStorage.removeItem(storageKey);
          return defaultState();
        }
      }

      function normalizeState(value) {
        if (value?.mode === "simple-fixed-budget") {
          return {
            version: 4,
            mode: "simple-fixed-budget",
            months: Object.fromEntries(Object.entries(value.months || {}).map(([key, month]) => [key, normalizeMonth(month)])),
          };
        }
        return migrateLegacyState(value);
      }

      function normalizeMonth(month = {}) {
        return {
          incomes: normalizeRows(month.incomes, "Inkomst"),
          fixedCosts: normalizeRows(month.fixedCosts, "Fast kostnad"),
          locked: Boolean(month.locked),
        };
      }

      function normalizeRows(rows, fallbackName) {
        const source = Array.isArray(rows) ? rows : [];
        return source.map((row) => ({
          id: row.id || newId(),
          name: String(row.name || fallbackName),
          amount: Number(row.amount ?? row.actual ?? 0) || 0,
        }));
      }

      function migrateLegacyState(value) {
        const next = { version: 4, mode: "simple-fixed-budget", months: {} };
        const oldMonths = value?.months || {};
        const templateFixed = Array.isArray(value?.budgetTemplate?.fixedCosts) ? value.budgetTemplate.fixedCosts : [];
        const legacyKeys = Object.keys(oldMonths);
        const keys = legacyKeys.length ? legacyKeys : [currentMonth];

        for (const key of keys) {
          const oldMonth = oldMonths[key] || {};
          next.months[convertLegacyMonthKey(key)] = {
            incomes: normalizeRows(oldMonth.incomes, "Inkomst").map((row) => ({ ...row, amount: Number(row.actual ?? row.amount ?? 0) || 0 })),
            fixedCosts: templateFixed.map((row) => ({
              id: row.id || newId(),
              name: String(row.name || "Fast kostnad"),
              amount: Number(row.amount || 0) || 0,
            })),
            locked: Boolean(oldMonth.closed),
          };
        }
        return next;
      }

      function convertLegacyMonthKey(key) {
        const legacy = {
          "maj-27": "2027-05",
          "jun-27": "2027-06",
          "jul-27": "2027-07",
          "aug-27": "2027-08",
          "sep-27": "2027-09",
          "okt-27": "2027-10",
          "nov-27": "2027-11",
          "dec-27": "2027-12",
          "jan-28": "2028-01",
          "feb-28": "2028-02",
          "mar-28": "2028-03",
          "apr-28": "2028-04",
        };
        return legacy[key] || (/^\d{4}-\d{2}$/.test(key) ? key : currentMonth);
      }

      function activeMonth() {
        if (!state.months[currentMonth]) {
          state.months[currentMonth] = blankMonth();
        }
        return state.months[currentMonth];
      }

      function sum(rows) {
        return rows.reduce((total, row) => total + (Number(row.amount) || 0), 0);
      }

      function money(value) {
        return moneyFormatter.format(Number(value) || 0);
      }

      function parseAmount(value) {
        return Number(String(value).replace(/\s/g, "").replace(",", ".")) || 0;
      }

      function saveLocal() {
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function queueSave() {
        saveLocal();
        renderSummary();
        if (!currentUser || !supabaseClient) {
          nodes.saveStatus.textContent = "Sparad lokalt";
          return;
        }
        nodes.saveStatus.textContent = "Sparar...";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveRemote, 450);
      }

      async function saveRemote() {
        const { error } = await supabaseClient.rpc("save_budget_state", { p_data: state });
        if (error) {
          nodes.saveStatus.textContent = "Kunde inte spara till Supabase.";
          return;
        }
        nodes.saveStatus.textContent = "Sparad";
      }

      async function loadRemote() {
        if (!currentUser || !supabaseClient) return;
        nodes.saveStatus.textContent = "Läser från Supabase...";
        const { data, error } = await supabaseClient.from("budget_state").select("data").eq("id", budgetRowId).maybeSingle();
        if (error) {
          nodes.saveStatus.textContent = "Kunde inte läsa från Supabase.";
          return;
        }
        if (data?.data) {
          state = normalizeState(data.data);
          if (!state.months[currentMonth]) {
            currentMonth = Object.keys(state.months).sort().at(-1) || currentMonth;
          }
          saveLocal();
          await saveRemote();
        }
        nodes.saveStatus.textContent = "Sparad";
        render();
      }

      function render() {
        const date = dateFromMonthKey(currentMonth);
        nodes.monthLabel.textContent = monthFormatter.format(date);
        document.getElementById("lockMonth").textContent = activeMonth().locked ? "Öppna månad" : "Markera klar";
        renderRows("incomes", nodes.incomeRows);
        renderRows("fixedCosts", nodes.costRows);
        renderSummary();
      }

      function renderSummary() {
        const month = activeMonth();
        const income = sum(month.incomes);
        const cost = sum(month.fixedCosts);
        const left = income - cost;
        nodes.incomeTotal.textContent = money(income);
        nodes.costTotal.textContent = money(cost);
        nodes.leftTotal.textContent = money(left);
        nodes.leftMetric.classList.toggle("good", left >= 0);
        nodes.leftMetric.classList.toggle("bad", left < 0);
      }

      function renderRows(type, container) {
        const rows = activeMonth()[type];
        container.innerHTML = rows
          .map(
            (row) => `
              <div class="row" data-type="${type}" data-id="${row.id}">
                <input data-field="name" aria-label="Namn" value="${escapeHtml(row.name)}" placeholder="Namn" />
                <input class="money" data-field="amount" aria-label="Belopp" value="${row.amount || ""}" inputmode="decimal" placeholder="0" />
                <button class="icon-button danger" data-remove="${row.id}" type="button" aria-label="Ta bort">×</button>
              </div>
            `
          )
          .join("");
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function setAuthUi() {
        const loggedIn = Boolean(currentUser);
        nodes.authPanel.classList.toggle("hidden", loggedIn || !supabaseClient);
        nodes.logoutButton.classList.toggle("hidden", !loggedIn);
        nodes.userStatus.textContent = loggedIn ? currentUser.email : supabaseClient ? "Inte inloggad" : "Supabase saknar config";
      }

      document.addEventListener("input", (event) => {
        const rowElement = event.target.closest(".row");
        if (!rowElement) return;
        const rows = activeMonth()[rowElement.dataset.type];
        const row = rows.find((item) => item.id === rowElement.dataset.id);
        if (!row) return;
        const field = event.target.dataset.field;
        row[field] = field === "amount" ? parseAmount(event.target.value) : event.target.value;
        queueSave();
      });

      document.addEventListener("click", (event) => {
        const removeId = event.target.closest("[data-remove]")?.dataset.remove;
        if (removeId) {
          for (const type of ["incomes", "fixedCosts"]) {
            activeMonth()[type] = activeMonth()[type].filter((row) => row.id !== removeId);
          }
          render();
          queueSave();
        }
      });

      document.getElementById("addIncome").addEventListener("click", () => {
        activeMonth().incomes.push({ id: newId(), name: "Ny inkomst", amount: 0 });
        render();
        queueSave();
      });

      document.getElementById("addCost").addEventListener("click", () => {
        activeMonth().fixedCosts.push({ id: newId(), name: "Ny fast kostnad", amount: 0 });
        render();
        queueSave();
      });

      document.getElementById("previousMonth").addEventListener("click", () => {
        currentMonth = shiftMonth(currentMonth, -1);
        render();
      });

      document.getElementById("nextMonth").addEventListener("click", () => {
        currentMonth = shiftMonth(currentMonth, 1);
        render();
      });

      document.getElementById("copyPrevious").addEventListener("click", () => {
        const previous = state.months[shiftMonth(currentMonth, -1)];
        if (!previous) {
          nodes.saveStatus.textContent = "Det finns ingen föregående månad att kopiera.";
          return;
        }
        state.months[currentMonth] = JSON.parse(JSON.stringify(previous));
        state.months[currentMonth].locked = false;
        render();
        queueSave();
      });

      document.getElementById("lockMonth").addEventListener("click", () => {
        activeMonth().locked = !activeMonth().locked;
        render();
        queueSave();
      });

      nodes.authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        nodes.authMessage.textContent = "Loggar in...";
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: nodes.emailInput.value.trim(),
          password: nodes.passwordInput.value,
        });
        if (error) {
          nodes.authMessage.textContent = error.message;
          return;
        }
        currentUser = data.user;
        nodes.passwordInput.value = "";
        nodes.authMessage.textContent = "";
        setAuthUi();
        await loadRemote();
      });

      nodes.logoutButton.addEventListener("click", async () => {
        if (supabaseClient) await supabaseClient.auth.signOut();
        currentUser = null;
        setAuthUi();
      });

      async function initializeAuth() {
        if (!supabaseClient) {
          nodes.saveStatus.textContent = "Sparad lokalt";
          setAuthUi();
          render();
          return;
        }
        const { data } = await supabaseClient.auth.getSession();
        currentUser = data.session?.user || null;
        setAuthUi();
        render();
        if (currentUser) await loadRemote();

        supabaseClient.auth.onAuthStateChange(async (_event, session) => {
          currentUser = session?.user || null;
          setAuthUi();
          if (currentUser) await loadRemote();
        });
      }

      render();
      initializeAuth();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      }
    </script>
  </body>
</html>
