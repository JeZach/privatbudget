<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Snabbköp" />
    <title>Snabbköp</title>
    <link rel="manifest" href="quick-manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --ink: #16211d;
        --muted: #63716b;
        --line: #dce5df;
        --paper: #eef4f0;
        --panel: #ffffff;
        --deep: #10251d;
        --green: #1e7a55;
        --mint: #dff4e9;
        --amber: #bd7b16;
        --rose: #b83b5e;
        --soft: #edf3ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        width: min(680px, 100%);
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 12px max(22px, env(safe-area-inset-bottom));
        display: grid;
        gap: 12px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
        line-height: 1;
      }

      h2 {
        font-size: 17px;
      }

      p,
      label,
      .small {
        color: var(--muted);
        font-weight: 750;
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: linear-gradient(135deg, #80d5a3, #f3c879);
        display: grid;
        place-items: center;
        color: var(--deep);
        font-weight: 850;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        display: grid;
        gap: 12px;
        box-shadow: 0 16px 40px rgba(22, 33, 29, 0.08);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .mode-picker {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .mode-button {
        min-height: 52px;
        display: grid;
        place-items: center;
      }

      .mode-button.active {
        background: var(--deep);
        border-color: var(--deep);
        color: #eef8f2;
      }

      .mode-panel {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdfb;
        color: var(--ink);
        padding: 9px 10px;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid rgba(30, 122, 85, 0.18);
        border-color: rgba(30, 122, 85, 0.55);
      }

      .money {
        text-align: right;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fdfefd;
        color: var(--ink);
        font-weight: 850;
        padding: 0 12px;
      }

      button.primary {
        background: var(--deep);
        color: #eef8f2;
        border-color: var(--deep);
      }

      button:disabled {
        opacity: 0.55;
      }

      .full {
        grid-column: 1 / -1;
      }

      .receipt-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(120px, auto);
        gap: 10px;
        align-items: end;
      }

      .file-input input {
        padding: 7px;
      }

      .receipt-summary {
        display: grid;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfdfb;
      }

      .receipt-summary div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 850;
      }

      .receipt-summary span {
        color: var(--muted);
        font-weight: 750;
      }

      .status {
        min-height: 34px;
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--soft);
        color: var(--muted);
        font-weight: 800;
        line-height: 1.35;
      }

      .status.ok {
        background: var(--mint);
        color: var(--green);
      }

      .status.bad {
        background: #ffe3e9;
        color: var(--rose);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 560px) {
        .grid,
        .receipt-actions,
        .mode-picker {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 28px;
        }

        body {
          font-size: 15px;
        }

        .mark {
          width: 36px;
          height: 36px;
        }

        button.primary {
          width: 100%;
        }

        .card {
          padding: 12px;
        }

        label {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Snabbköp</h1>
          <p>Registrera köp direkt från mobilen.</p>
        </div>
        <div class="mark">kr</div>
      </header>

      <section class="card" id="pinCard">
        <h2>Öppna snabbregistrering</h2>
        <label>PIN <input id="pinInput" inputmode="numeric" autocomplete="one-time-code" placeholder="Till exempel 1234" /></label>
        <button class="primary" id="pinButton" type="button">Logga in</button>
        <div class="status" id="pinStatus">PIN krävs för att lägga in köp utan vanlig inloggning.</div>
      </section>

      <section class="card hidden" id="purchaseCard">
        <h2>Nytt köp</h2>
        <div class="mode-picker" aria-label="Välj registreringssätt">
          <button class="mode-button" data-mode="photo" type="button">Foto</button>
          <button class="mode-button" data-mode="voice" type="button">Röst</button>
          <button class="mode-button" data-mode="manual" type="button">Manuellt</button>
        </div>

        <section class="mode-panel hidden" data-mode-panel="photo">
          <div class="grid">
            <label>Budgetmånad <select id="monthKey"></select></label>
            <label>Kategori <select id="category"></select></label>
            <label>Datum <input id="purchaseDate" type="date" /></label>
            <label>Belopp <input class="money" id="amount" inputmode="decimal" placeholder="0" /></label>
            <label class="full">Butik/beskrivning <input id="description" placeholder="Till exempel ICA, apotek, SL" /></label>
          </div>
          <div class="receipt-actions">
            <label class="file-input">Fota kvitto <input id="receipt" type="file" accept="image/*" capture="environment" /></label>
            <button id="ocrButton" type="button">Läs kvitto</button>
          </div>
        </section>

        <section class="mode-panel hidden" data-mode-panel="voice">
          <div class="grid">
            <label>Budgetmånad <select id="voiceMonthKey"></select></label>
            <label>Kategori <select id="voiceCategory"></select></label>
            <label>Datum <input id="voicePurchaseDate" type="date" /></label>
            <label>Belopp <input class="money" id="voiceAmount" inputmode="decimal" placeholder="0" /></label>
            <label class="full">Butik/beskrivning <input id="voiceDescription" placeholder="Till exempel ICA, apotek, SL" /></label>
          </div>
          <button id="voiceButton" type="button">Tala in köp</button>
        </section>

        <section class="mode-panel hidden" data-mode-panel="manual">
          <div class="grid">
            <label>Budgetmånad <select id="manualMonthKey"></select></label>
            <label>Kategori <select id="manualCategory"></select></label>
            <label>Datum <input id="manualPurchaseDate" type="date" /></label>
            <label>Belopp <input class="money" id="manualAmount" inputmode="decimal" placeholder="0" /></label>
            <label class="full">Butik/beskrivning <input id="manualDescription" placeholder="Till exempel ICA, apotek, SL" /></label>
          </div>
        </section>

        <div class="receipt-summary hidden" id="receiptSummary">
          <div><span>Butik</span><strong id="receiptStore">Inte läst</strong></div>
          <div><span>Totalsumma</span><strong id="receiptTotal">0 kr</strong></div>
        </div>
        <button class="primary hidden" id="saveButton" type="button">Registrera köp</button>
        <div class="status" id="saveStatus">Välj Foto, Röst eller Manuellt för att börja.</div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
      const monthLabels = ["Maj 2027", "Juni 2027", "Juli 2027", "Augusti 2027", "September 2027", "Oktober 2027", "November 2027", "December 2027", "Januari 2028", "Februari 2028", "Mars 2028", "April 2028"];
      const monthKeys = ["maj-27", "jun-27", "jul-27", "aug-27", "sep-27", "okt-27", "nov-27", "dec-27", "jan-28", "feb-28", "mar-28", "apr-28"];
      const supabaseConfig = window.PRIVATBUDGET_SUPABASE || {};
      const client = window.supabase && supabaseConfig.url && supabaseConfig.anonKey ? window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey) : null;
      const pinInput = document.getElementById("pinInput");
      const pinStatus = document.getElementById("pinStatus");
      const pinCard = document.getElementById("pinCard");
      const purchaseCard = document.getElementById("purchaseCard");
      const category = document.getElementById("category");
      const monthKey = document.getElementById("monthKey");
      const purchaseDate = document.getElementById("purchaseDate");
      const amount = document.getElementById("amount");
      const description = document.getElementById("description");
      const voiceCategory = document.getElementById("voiceCategory");
      const voiceMonthKey = document.getElementById("voiceMonthKey");
      const voicePurchaseDate = document.getElementById("voicePurchaseDate");
      const voiceAmount = document.getElementById("voiceAmount");
      const voiceDescription = document.getElementById("voiceDescription");
      const manualCategory = document.getElementById("manualCategory");
      const manualMonthKey = document.getElementById("manualMonthKey");
      const manualPurchaseDate = document.getElementById("manualPurchaseDate");
      const manualAmount = document.getElementById("manualAmount");
      const manualDescription = document.getElementById("manualDescription");
      const receipt = document.getElementById("receipt");
      const receiptStore = document.getElementById("receiptStore");
      const receiptTotal = document.getElementById("receiptTotal");
      const receiptSummary = document.getElementById("receiptSummary");
      const saveButton = document.getElementById("saveButton");
      const saveStatus = document.getElementById("saveStatus");
      let receiptOcrText = "";
      let categoryRows = [];
      let categoryRules = [];
      let activeMode = "";
      let activeRecognition = null;

      const fieldSets = {
        photo: { monthKey, category, purchaseDate, amount, description },
        voice: { monthKey: voiceMonthKey, category: voiceCategory, purchaseDate: voicePurchaseDate, amount: voiceAmount, description: voiceDescription },
        manual: { monthKey: manualMonthKey, category: manualCategory, purchaseDate: manualPurchaseDate, amount: manualAmount, description: manualDescription },
      };

      Object.values(fieldSets).forEach((fields) => {
        fields.monthKey.innerHTML = monthKeys.map((key, index) => `<option value="${key}">${monthLabels[index]}</option>`).join("");
        fields.purchaseDate.value = new Date().toISOString().slice(0, 10);
      });
      pinInput.value = localStorage.getItem("quickPurchasePin") || "";

      function setStatus(node, text, type = "") {
        node.textContent = text;
        node.className = `status ${type}`.trim();
      }

      function parseAmount(value) {
        return Number(String(value).replace(/\s/g, "").replace("kr", "").replace(",", ".").replace(/[^\d.-]/g, "")) || 0;
      }

      function formatAmount(value) {
        return String(value || "").replace(".", ",");
      }

      function activeFields() {
        return fieldSets[activeMode] || fieldSets.manual;
      }

      function stopVoiceRecognition() {
        if (!activeRecognition) return;
        try {
          activeRecognition.onresult = null;
          activeRecognition.onerror = null;
          activeRecognition.onend = null;
          activeRecognition.stop();
        } catch {
          // SpeechRecognition kan redan vara stoppad.
        }
        activeRecognition = null;
      }

      function setMode(mode) {
        activeMode = mode;
        stopVoiceRecognition();
        document.querySelectorAll("[data-mode]").forEach((button) => {
          button.classList.toggle("active", button.dataset.mode === mode);
        });
        document.querySelectorAll("[data-mode-panel]").forEach((panel) => {
          panel.classList.toggle("hidden", panel.dataset.modePanel !== mode);
        });
        receiptSummary.classList.toggle("hidden", mode === "manual");
        saveButton.classList.remove("hidden");
        receiptStore.textContent = "Inte läst";
        receiptTotal.textContent = "0 kr";
        receiptOcrText = "";
        setStatus(saveStatus, mode === "photo" ? "Fota kvittot och läs in butik och totalsumma." : mode === "voice" ? "Tryck Tala in köp och säg butik, belopp och gärna kategori." : "Fyll i köpet manuellt och registrera.", "");
      }

      function closePurchaseMode() {
        stopVoiceRecognition();
        activeMode = "";
        document.querySelectorAll("[data-mode]").forEach((button) => button.classList.remove("active"));
        document.querySelectorAll("[data-mode-panel]").forEach((panel) => panel.classList.add("hidden"));
        receiptSummary.classList.add("hidden");
        saveButton.classList.add("hidden");
        receiptOcrText = "";
        receipt.value = "";
        receiptStore.textContent = "Inte läst";
        receiptTotal.textContent = "0 kr";
        Object.values(fieldSets).forEach((fields) => {
          fields.amount.value = "";
          fields.description.value = "";
          fields.purchaseDate.value = new Date().toISOString().slice(0, 10);
        });
        setStatus(saveStatus, "Köpet är skickat till Godkänn köp. Välj nästa metod när du vill registrera mer.", "ok");
      }

      function categoriesForAi() {
        return categoryRows.map((row) => ({
          id: row.id,
          name: row.name,
          rules: categoryRules.filter((rule) => rule.target_id === row.id).map((rule) => rule.pattern),
        }));
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function applyAiPurchase(parsed) {
        const fields = activeFields();
        if (parsed.store) fields.description.value = parsed.store;
        if (parsed.amount) fields.amount.value = formatAmount(parsed.amount);
        if (parsed.date) fields.purchaseDate.value = parsed.date;
        if (parsed.categoryId && [...fields.category.options].some((option) => option.value === parsed.categoryId)) {
          fields.category.value = parsed.categoryId;
        }
        receiptStore.textContent = parsed.store || "Hittades inte";
        receiptTotal.textContent = parsed.amount ? `${formatAmount(parsed.amount)} kr` : "Hittades inte";
      }

      async function parseWithAi(payload) {
        const { data, error } = await client.functions.invoke("ai-parse-purchase", {
          body: { ...payload, pin: pinInput.value.trim(), categories: categoriesForAi() },
        });
        if (error || data?.error) throw new Error(data?.error || error?.message || "AI-funktionen saknas eller svarar inte.");
        applyAiPurchase(data);
        return data;
      }

      function storeCandidate(lines) {
        const blocked = /^(org|datum|date|tid|time|kvitto|receipt|terminal|kort|visa|mastercard|summa|total|moms|vat|att betala|belopp|change|cash|kontant)/i;
        return lines.find((line) => /[A-Za-zÅÄÖåäö]{3}/.test(line) && !blocked.test(line) && line.length <= 42) || "";
      }

      function totalCandidate(lines, text) {
        const totalKeywords = /(att betala|summa|total|totalt|belopp)/i;
        const totalLineIndex = lines.findIndex((line) => totalKeywords.test(line));
        const candidates = [];
        const collect = (source, weight) => {
          for (const match of source.matchAll(/\b\d{1,5}(?:[ .]\d{3})*(?:[,:.]\d{2})\b|\b\d{2,5}\b/g)) {
            const value = parseAmount(match[0]);
            if (value > 0 && value < 100000) candidates.push({ value, weight });
          }
        };
        if (totalLineIndex >= 0) {
          collect(lines.slice(totalLineIndex, totalLineIndex + 3).join(" "), 10);
        }
        collect(text, 1);
        candidates.sort((a, b) => (b.weight - a.weight) || (b.value - a.value));
        return candidates[0]?.value || 0;
      }

      function parseReceipt(text) {
        const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
        const store = storeCandidate(lines);
        const total = totalCandidate(lines, text);
        const fields = activeFields();
        if (total) fields.amount.value = formatAmount(total);
        if (store) fields.description.value = store.slice(0, 70);
        receiptStore.textContent = store || "Hittades inte";
        receiptTotal.textContent = total ? `${formatAmount(total)} kr` : "Hittades inte";
      }

      async function loadCategories() {
        if (!client) {
          setStatus(pinStatus, "Supabase saknas i config.js.", "bad");
          return;
        }
        const pin = pinInput.value.trim();
        if (!pin) {
          setStatus(pinStatus, "Fyll i PIN först.", "bad");
          return;
        }
        setStatus(pinStatus, "Hämtar kategorier...");
        const { data, error } = await client.rpc("quick_budget_categories", { p_pin: pin });
        if (error || !data?.length) {
          setStatus(pinStatus, "Kunde inte hämta kategorier. Kontrollera PIN och att SQL är körd i Supabase.", "bad");
          return;
        }
        localStorage.setItem("quickPurchasePin", pin);
        categoryRows = data;
        const rulesResult = await client.rpc("quick_category_rules", { p_pin: pin });
        categoryRules = rulesResult.data || [];
        const categoryOptions = categoryRows.map((row) => `<option value="${row.id}">${row.name}</option>`).join("");
        [category, voiceCategory, manualCategory].forEach((select) => {
          select.innerHTML = categoryOptions;
        });
        pinCard.classList.add("hidden");
        purchaseCard.classList.remove("hidden");
        setStatus(saveStatus, "Välj Foto, Röst eller Manuellt för att börja.", "");
      }

      async function readReceipt() {
        const file = receipt.files?.[0];
        if (!file) {
          setStatus(saveStatus, "Välj eller fota ett kvitto först.", "bad");
          return;
        }
        setStatus(saveStatus, "Läser kvittot med AI...");
        try {
          const imageDataUrl = await fileToDataUrl(file);
          const parsed = await parseWithAi({ imageDataUrl });
          receiptOcrText = parsed.note || "";
          setStatus(saveStatus, "Butik, totalsumma och kategori är tolkade. Kontrollera innan du registrerar.", "ok");
        } catch {
          setStatus(saveStatus, "AI kunde inte läsa kvittot. Försöker lokal OCR...");
          const result = await Tesseract.recognize(file, "swe+eng");
          receiptOcrText = result.data.text.trim();
          parseReceipt(receiptOcrText);
          setStatus(saveStatus, "Butik och totalsumma är hämtade. Välj kategori innan du registrerar.", "ok");
        }
      }

      async function voicePurchase() {
        activeMode = "voice";
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setStatus(saveStatus, "Taligenkänning stöds inte i den här webbläsaren.", "bad");
          return;
        }
        stopVoiceRecognition();
        const recognition = new SpeechRecognition();
        activeRecognition = recognition;
        recognition.lang = "sv-SE";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        setStatus(saveStatus, "Lyssnar... säg till exempel: jag köpte mat på Ica för 733 kr.");
        recognition.onresult = async (event) => {
          const text = event.results[0][0].transcript;
          receiptOcrText = text;
          setStatus(saveStatus, `Tolkar: ${text}`);
          try {
            recognition.stop();
          } catch {
            // Lyssningen är redan klar.
          }
          try {
            await parseWithAi({ text });
            setStatus(saveStatus, "Köpet är tolkat från röst. Kontrollera kategori och belopp.", "ok");
          } catch (error) {
            setStatus(saveStatus, error.message || "Kunde inte tolka rösten med AI.", "bad");
          }
        };
        recognition.onerror = () => setStatus(saveStatus, "Kunde inte lyssna klart. Försök igen.", "bad");
        recognition.onend = () => {
          if (activeRecognition === recognition) activeRecognition = null;
        };
        recognition.start();
      }

      async function savePurchase() {
        const pin = pinInput.value.trim();
        if (!activeMode) {
          setStatus(saveStatus, "Välj Foto, Röst eller Manuellt först.", "bad");
          return;
        }
        const fields = activeFields();
        const value = parseAmount(fields.amount.value);
        if (!fields.category.value) {
          setStatus(saveStatus, "Välj kategori innan köpet registreras.", "bad");
          return;
        }
        if (!value) {
          setStatus(saveStatus, "Fyll i belopp.", "bad");
          return;
        }
        setStatus(saveStatus, "Registrerar köp...");
        stopVoiceRecognition();
        const { error } = await client.rpc("quick_add_purchase", {
          p_pin: pin,
          p_month_key: fields.monthKey.value,
          p_target_id: fields.category.value,
          p_purchase_date: fields.purchaseDate.value,
          p_description: fields.description.value.trim() || "Snabbköp",
          p_amount: value,
          p_receipt_text: receiptOcrText,
        });
        if (error) {
          setStatus(saveStatus, error.message || "Köpet kunde inte registreras.", "bad");
          return;
        }
        closePurchaseMode();
      }

      document.getElementById("pinButton").addEventListener("click", loadCategories);
      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });
      document.getElementById("ocrButton").addEventListener("click", readReceipt);
      document.getElementById("voiceButton").addEventListener("click", voicePurchase);
      document.getElementById("saveButton").addEventListener("click", savePurchase);
    </script>
  </body>
</html>
